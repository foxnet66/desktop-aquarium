<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1825" />
    <meta
      name="description"
      content="A saltwater aquarium with three clownfish, a host anemone, small shoals and cleaner shrimp. A local, interactive 3D aquarium preview."
    />
    <title>珊瑚海 · 桌面鱼缸</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="habitat" aria-label="Interactive saltwater aquarium">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="A saltwater tank with three clownfish, an anemone, small reef fish and cleaner shrimp. Click to feed. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Aquariums">
        <a class="home-link" href="../../" aria-label="返回场景选择">桌面鱼缸</a>
        <div class="scene-nav">
          <a href="../riverscape/">水草溪流</a>
          <span aria-current="page">珊瑚海</span>
        </div>
      </nav>
      <footer class="chrome" aria-label="Aquarium controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="空格">暂停</button>
          <button disabled id="feed">投喂</button>
          <button disabled id="fullscreen" title="F">全屏</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="画质">
            <option value="eco">节能</option>
            <option value="balanced" selected>均衡</option>
            <option value="detail">精细</option>
          </select>
          <button disabled id="hide" title="H">隐藏控制</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">显示控制</button>
      <div id="loading" role="status"><p>鱼缸正在苏醒…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
