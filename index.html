<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09110f" />
    <meta name="description" content="一座会回应你的桌面鱼缸：珊瑚海与水草溪流，鱼群会避让光标并争抢食物。" />
    <title>桌面鱼缸</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071420'/%3E%3Cpath d='M15 34c9-12 22-13 32-4l8-6-2 12 2 12-9-7c-11 8-24 5-31-7Z' fill='%2378e5dc'/%3E%3Ccircle cx='39' cy='30' r='2' fill='%23071420'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="ui/gallery.css" />
  </head>
  <body>
    <header class="masthead">
      <h1><span class="logo-placeholder" aria-hidden="true"></span>桌面鱼缸</h1>
    </header>
    <main class="gallery" aria-label="Aquariums" aria-roledescription="carousel" aria-describedby="gallery-help" aria-keyshortcuts="ArrowLeft ArrowRight">
      <p class="sr-only" id="gallery-help">左右滑动或使用方向键选择鱼缸，点击画面进入。</p>
      <p class="sr-only" id="gallery-status" role="status" aria-live="polite" aria-atomic="true">珊瑚海</p>
      <a draggable="false" class="portal reef is-active" id="reef" href="scenes/reefscape/" aria-label="打开珊瑚海">
        <div class="portal-image">
          <span class="preview-status" hidden>预览暂不可用</span>
          <img draggable="false" src="docs/images/reefscape-wide.png" alt="小丑鱼游过海葵与珊瑚" width="1440" height="750" fetchpriority="high" />
        </div>
        <div class="portal-caption">
          <h2>珊瑚海<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal river" id="river" role="button" href="scenes/riverscape/" aria-label="预览水草溪流">
        <div class="portal-image">
          <span class="preview-status" hidden>预览暂不可用</span>
          <img draggable="false" src="docs/images/riverscape-wide.png" alt="鱼群游过水草与沉木" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>水草溪流<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
    </main>
    <script type="module" src="ui/gallery.js"></script>
  </body>
</html>
